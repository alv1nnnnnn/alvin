<!doctype html>
<html lang="en" x-data="portfolio()" :class="{ dark }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The languages, frameworks, platforms, and tools Alvin Nario uses.">
  <title>Tech stack | Alvin Nario</title>
  <link rel="icon" type="image/png" href="/images/logo-light.png"
        :href="dark ? '/images/logo-dark.png' : '/images/logo-light.png'">
  <script src="/portfolio.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/resources/css/portfolio.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" x-data="{ menuOpen: false }" @click.outside="menuOpen = false"
          @keydown.escape="if (menuOpen) { menuOpen = false; $refs.menuToggle.focus() }">
    <div class="shell header-inner">
      <a class="wordmark" href="/" aria-label="Alvin Nario home">
        <img src="/images/logo-light.png" :src="dark ? '/images/logo-dark.png' : '/images/logo-light.png'"
             alt="" width="56" height="56">
      </a>
      <button class="menu-toggle" type="button" x-ref="menuToggle" aria-controls="main-navigation"
              :aria-expanded="menuOpen" :aria-label="menuOpen ? 'Close menu' : 'Open menu'"
              @click="menuOpen = !menuOpen">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path :d="menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 6h16M4 12h16M4 18h16'" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <nav id="main-navigation" aria-label="Main navigation" :class="{ 'is-open': menuOpen }"
           @click="if ($event.target.closest('a')) menuOpen = false">
        <a href="/projects/">Projects</a>
        <a href="/tech-stack/" aria-current="page">Tech stack</a>
        <a href="/#experience">Experience</a>
        <a href="/#contact">Contact</a>
      </nav>
      <button class="theme-switch" type="button" @click="toggleTheme()" aria-label="Dark mode" :aria-pressed="dark">
        <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
        <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M21 13a9 9 0 1 1-10-10 8 8 0 0 0 10 10Z"/></svg>
      </button>
    </div>
  </header>

  <main class="shell listing-page" id="main">
    <h1>Tech stack</h1>
    <div class="skills-grid">
      <template x-for="group in techStack" :key="group.label">
        <div>
          <h3 x-text="group.label"></h3>
          <ul class="tags">
            <template x-for="tech in group.items" :key="tech">
              <li x-text="tech"></li>
            </template>
          </ul>
        </div>
      </template>
    </div>
    <footer>© 2026 Alvin Nario</footer>
  </main>
</body>
</html>
